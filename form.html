    <main>
        <!-- Add this to your contact.html -->

        <section class="form-container">
            <h1>Get in Touch</h1>
            <p>Have a question? <br> Send me a message and I'll get back to you shortly.</p>

            <!-- Added URL from Formspree endpoint -->
            <form action="https://formspree.io/f/xljebjrl" method="POST" id="contact-form">
                <div class="form-group">
                    <label class="standard-label" for="user-name">Name:</label>
                    <input type="text" name="name" id="user-name" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label class="standard-label" for="user-email">E-mail:</label>
                    <input type="email" name="email" id="user-email" placeholder="email@example.com" required>
                </div>

                <div class="form-group">
                    <label class="standard-label" for="user-phone">Telephone (Optional):</label>
                    <input type="tel" name="phone" id="user-phone" pattern="\d{3}[\-]\d{3}[\-]\d{4}"
                        placeholder="000-000-0000">
                </div>

                <div class="form-group">
                    <label class="standard-label" for="user-message">Message:</label>
                    <textarea name="message" id="user-message" maxlength="240" placeholder="Write your message here..."
                        required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>

    </main>
